name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # The examples are part of the docs; they must at least build.
      - run: cargo build --examples
      - run: cargo doc --no-deps

  # cargo-oracle auditing its own test suite. Informational for now: the
  # thresholds worth gating on are a decision this project has not made yet,
  # and a gate nobody chose is a gate nobody trusts.
  self-audit:
    name: self-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo build --release
      - name: Static oracle audit
        run: ./target/release/cargo-oracle lint --verbose
      - name: Execution coverage
        run: ./target/release/cargo-oracle coverage

  nix:
    name: nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - run: nix build .#default
      - run: nix develop --command cargo test --all
