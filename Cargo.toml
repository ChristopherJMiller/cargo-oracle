[workspace]
resolver = "2"
members = ["crates/oracle-core", "crates/cargo-oracle", "crates/oracle-switch"]
exclude = ["crates/oracle-core/tests/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/chrismiller/cargo-oracle"
description = "Symbol-level test attribution for Rust: which tests verify which symbols"

[workspace.dependencies]
oracle-core = { path = "crates/oracle-core", version = "0.1.0" }
oracle-switch = { path = "crates/oracle-switch", version = "0.1.0" }

anyhow = "1"
camino = { version = "1", features = ["serde1"] }
cargo_metadata = "0.19"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits", "parsing"] }
walkdir = "2"

[profile.release]
lto = "thin"
